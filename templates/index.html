{% extends 'base.html' %}
{% block title %}CSDN博客{% endblock %}
{% block main %}
  <h3>博客列表</h3>
    <div class="row row-cols-2">
        {% for blog in blogs %}
            <div class="col">
                <div class="card">
                    <div class="card-header">
                        <a herf="{% url 'blog:blog_detail' blog_id=blog.id %}">{{ blog.title }}</a>
                    </div>
                    <div class="card-body" style="height:120px">
                        <p class="card-text">{{blog.content|striptags|truncatechars:200}}</p>
                    </div>
                    <div class="card-footer text-body-secondary d-flex justify-content-between">
                        <div>
                            <img src="{% static 'image/user.webp' %}" class="rounded-circle" alt="" width="30" height="30">
                            <span class="ms-2" style="line-height:30px">{{blog.author.username}}</span>
                        </div>
                        <div style="line-height:30px">发布时间： {{ blog.pub_time|date:"Y年m月d日 h时i分" }}</div>
                    </div>
                </div>
            </div>
        {% endfor %}
    </div>
{% endblock %}
