{% extends 'base.html' %}
{% block title %}发布{% endblock %}
{% block head %}
    <link href="https://unpkg.com/@wangeditor/editor@latest/dist/css/style.css" rel="stylesheet">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://unpkg.com/@wangeditor/editor@latest/dist/index.js"></script>
    <script src="{% static 'js/pub_blog.js' %}"></script>
    <style Remove-Item -Recurse -Force .gityle>
      #editor—wrapper {
        border: 1px solid #ccc;
        z-index: 100; /* 按需定义 */
      }
      #toolbar-container {
        border-bottom: 1px solid #ccc;
      }
      #editor-container {
        height: 500px;
      }
    </style>
{% endblock %}
{% block main %}
    <h3>发布博客</h3>
    <form action="" method="POST">
        {% csrf_token %}
        <div class="mb-3">
            <label for="title" class="form-label">标题</label>
            <input type="text" class="form-control" id="title" placeholder="请输入标题">
        </div>
        <div class="mb-3">
            <label for="category-select" class="form-label">话题</label>
            <select class="form-select" aria-label="Default select example" id="category-select">
              {% for  category in topic_categeries %}
                <option value="{{category.id}}">{{category.name}}</option>
              {% endfor %}
            </select>
        </div>
        <label  for="editor-container" class="mb-3 form-label">内容</label>
        <div id="editor—wrapper">
          <div id="toolbar-container"><!-- 工具栏 --></div>
          <div id="editor-container"><!-- 编辑器 --></div>
        </div>
        <div class="mb-3 text-end">
          <button type="submit" class="btn btn-primary mt-3" id="submit-btn">发布</button>
        </div>
    </form>
{% endblock %}
